:root{--night:#080d19;--gold:#d7bb7b;--cream:#f6eee1;--muted:#a7acb8;--line:rgba(215,187,123,.25)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#202c46 0%,var(--night) 58%);color:var(--cream);font-family:'DM Sans',sans-serif}.nav{max-width:1100px;margin:auto;padding:28px 24px;display:flex;justify-content:space-between;align-items:center}.brand,.eyebrow{font-family:'DM Mono',monospace;text-transform:uppercase;letter-spacing:.18em;color:var(--gold)}.brand{font-size:12px}.nav a{font-size:11px;letter-spacing:.12em;text-decoration:none;text-transform:uppercase;color:#c5c2bf}.wrap{max-width:1100px;margin:auto;padding:60px 24px 90px}.intro{text-align:center;margin:0 auto 48px;max-width:680px}.eyebrow{font-size:11px}.intro h1{font:400 clamp(44px,9vw,76px)/1.08 'Playfair Display',serif;margin:18px 0}.intro h1 em{color:var(--gold);font-weight:400}.intro p{color:#b6b9c2;line-height:1.8}.gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.memory{background:#eee5d5;color:#302b2b;padding:8px 8px 18px;box-shadow:0 20px 55px #0007;transform:rotate(var(--tilt));transition:transform .25s,box-shadow .25s}.memory:hover{transform:rotate(0) translateY(-5px);box-shadow:0 26px 65px #0009}.memory img{display:block;width:100%;height:300px;object-fit:cover;background:#17253d}.caption{font:italic 22px 'Playfair Display',serif;text-align:center;padding:15px 8px 0}.number{font:10px 'DM Mono',monospace;letter-spacing:.14em;color:#76684c;text-align:center;margin-top:8px}.back{text-align:center;margin-top:55px;font:11px 'DM Mono',monospace;letter-spacing:.1em;text-transform:uppercase}.back a{color:var(--gold);text-decoration:none}@media(max-width:760px){.gallery{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.memory img{height:260px}}@media(max-width:500px){.wrap{padding:42px 15px 70px}.nav{padding:22px 16px}.gallery{gap:12px}.memory{padding:6px 6px 13px}.memory img{height:210px}.caption{font-size:18px}}
